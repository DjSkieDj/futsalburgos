name: Actualizar Resultados y Clasificación

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'datos.json'
      - 'public/datos.json'
  schedule:
    # Lunes: cada hora en punto
    - cron: '0 * * * 1'
    # Martes a viernes: cada 2 horas
    - cron: '0 */2 * * 2-5'
    # Sábados y domingos: cada 2 horas
    - cron: '0 */2 * * 6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-datos:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio, actualizar datos y guardar cambios
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" repo
          cd repo
          git checkout "${BRANCH}"
          npm install --no-audit --no-fund
          node scraper.js
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Actualizador Liga Burgos"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "Actualización automática: jornadas y clasificación"
            git push origin "${BRANCH}"
          else
            echo "Sin cambios nuevos en la web oficial."
          fi

