name: Actualizar liga y publicar web

on:
  schedule:
    - cron: '17 * * * *' # cada hora, al minuto 17 (UTC). GitHub puede retrasarlo unos minutos.
  workflow_dispatch: # botón "Run workflow" para ejecutarlo a mano
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/**', '.github/workflows/scrape.yml']

permissions:
  contents: write # guardar docs/data.json cuando cambian los datos
  pages: write
  id-token: write

concurrency:
  group: liga-pages
  cancel-in-progress: false

jobs:
  scrape-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tests del lector
        run: node --test tests/parse.test.js

      - name: Scraping de la web del Ayuntamiento
        run: node scripts/scrape.js

      - name: Guardar datos si han cambiado
        run: |
          if [ -n "$(git status --porcelain docs/data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data.json
            git commit -m "datos: actualización automática"
            git push
          else
            echo "Sin cambios en los datos"
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
